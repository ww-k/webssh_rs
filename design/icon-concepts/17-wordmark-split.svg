<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">WebSSH Prompt Split</title>
  <desc id="desc">A two-color terminal wordmark with WebSSH and RS split around a prompt.</desc>
  <rect width="512" height="512" rx="116" fill="#173B4A"/>
  <rect x="70" y="100" width="372" height="312" rx="48" fill="none" stroke="#51B8C5" stroke-width="18"/>
  <path d="M70 174h372" stroke="#51B8C5" stroke-width="18"/>
  <text x="105" y="151" fill="#51B8C5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" letter-spacing="1">WebSSH</text>
  <text x="407" y="151" text-anchor="end" fill="#51B8C5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" letter-spacing="2">RS</text>
  <text x="256" y="302" text-anchor="middle" fill="#51B8C5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="96" font-weight="700" letter-spacing="10">&gt;_</text>
  <path d="M142 354h228" stroke="#51B8C5" stroke-width="14" stroke-linecap="round"/>
</svg>
